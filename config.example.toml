# make up copies this file to config.toml if it is missing.
# Edit config.toml; it is private and ignored by Git.
# Example: sources = ["blog.codinghorror.com"]
# X example: sources = [{ domain = "x.com", accounts = ["example"] }]
# Reddit: sources = [{ domain = "reddit.com", feed_urls = ["r/LocalLLaMA"] }]
# Domain strings and tables with feed_urls/tags can be mixed.
# See docs/features/rss.md for examples.
sources = []

[clickhouse]
# Compose service name, reachable from the application container.
host = "clickhouse"
port = 8123
database = "dank"
username = "default"
password = ""
secure = false
use_http = true

[media]
# Use ["image"] for images only, or [] to keep references without downloads.
download_types = ["image", "audio", "video"]

[storage]
data_dir = "data"
max_asset_bytes = 10485760

# Optional; these concurrency limits apply in both native and Docker runs.
[scrape]
source_concurrency = 4
http_concurrency = 16
http_per_host = 2
media_concurrency = 4
queue_batches = 2

[reddit]
# Minimum spacing between Reddit browser actions; reuse unchanged details.
request_interval_seconds = 2.0
detail_cache_hours = 24.0
# Post bodies and media links are always collected from individual post pages.
capture_comments = true
comment_limit = 50
comment_sort = "best"
# Also requires "video" in media.download_types; false keeps remote playback.
download_videos = false

[rss]
feed_staleness_days = 14
keep_feed_on_fetch_failure = false
# Zero or omitted preserves unlimited fetching; use 20 for a bounded run.
max_entries_per_feed = 0

[browser]
executable_path = "/usr/local/bin/dank-chromium"

[logging]
file = "data/dank.log"
level = "INFO"

# Sign in with make x-login before collecting X accounts.
# Optional collection limits; no X password belongs in this file.
# [x]
# max_posts = 200
# max_scrolls = 20
# scroll_pause_seconds = 1.5

# Bounded conversation snapshots for each account's newest owned posts.
# [x.conversation]
# enabled = true
# max_posts_per_account = 5
# max_replies = 50
# max_scrolls = 3
# timeout_seconds = 30

# Optional autofill via the host's 1Password CLI; you submit each step yourself.
# [x.onepassword]
# username = "op://Personal/X/username"
# password = "op://Personal/X/password"
