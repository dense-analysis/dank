# Copy to config.toml for native execution with uv.
# Keep an existing native config.toml and its connection/data settings.
# Example: sources = ["blog.codinghorror.com"]
# Domain strings and tables with feed_urls/tags can be mixed.
# See docs/features/rss.md for examples.
sources = []

[clickhouse]
host = "localhost"
port = 8123
database = "dank"
username = "default"
password = ""
secure = false
use_http = true

[storage]
# Relative to the directory where you run DANK, or use your existing host path.
data_dir = "data"
max_asset_bytes = 10485760

# Optional; these concurrency limits apply in both native and Docker runs.
[scrape]
source_concurrency = 4
http_concurrency = 16
http_per_host = 2
media_concurrency = 4
queue_batches = 2

[rss]
feed_staleness_days = 14
keep_feed_on_fetch_failure = false
# Zero or omitted preserves unlimited fetching; use 20 for a bounded run.
max_entries_per_feed = 0

[logging]
file = "data/dank.log"
level = "INFO"

# Browser auto-detection is used when executable_path is omitted.
# [browser]
# executable_path = "/path/to/your/chromium-browser"

# See docs/features/x.md for X account and optional email settings.
