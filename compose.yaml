name: dank

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      # The database is reachable only on the Compose network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1 FROM dank.web_embedding_cache LIMIT 0"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  dank:
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.toml
        target: /run/dank/config.toml
        read_only: true
        bind:
          create_host_path: false
      - dank_data:/app/data
      - model_cache:/home/dank/.cache
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).close()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  clickhouse_data:
  dank_data:
  model_cache:
